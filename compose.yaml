services:
  rulelab:
    build: .
    ports: ["127.0.0.1:8000:8080"]
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-sqlite}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RULELAB_DB: /app/var/rulelab.sqlite3
      EMBEDDING_LOCATION: ${EMBEDDING_LOCATION:-us-central1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      RULELAB_AI_CONCURRENCY: ${RULELAB_AI_CONCURRENCY:-5}
      RULELAB_AI_TIMEOUT: ${RULELAB_AI_TIMEOUT:-90}
      RULELAB_API_TOKEN: ${RULELAB_API_TOKEN:-}
    volumes: ["rulelab-db:/app/var"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["elastic-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 10
volumes:
  rulelab-db:
  elastic-data:
